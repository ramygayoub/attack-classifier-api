name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Python code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install ruff

      - name: Run ruff
        run: ruff check --exit-zero main.py

      - name: Check Python syntax is valid
        run: python -m py_compile main.py

  sast-scan:
    name: SAST - Bandit security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit security scan
        run: bandit -r main.py -f screen
        continue-on-error: true

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: classifier-api:ci-test
          outputs: type=docker,dest=/tmp/classifier-api.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: classifier-api-image
          path: /tmp/classifier-api.tar

  container-scan:
    name: Container vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: classifier-api-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/classifier-api.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: classifier-api:ci-test
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
